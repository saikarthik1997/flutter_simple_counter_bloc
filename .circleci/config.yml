version: 2.1

orbs:
  flutter: circleci/flutter@2.0.0

jobs:
  build_flutter_apk:
    executor:
      name: flutter/default
      tag: "3.24.0"  # ← specify your Flutter version
    steps:
      - checkout

      - run:
          name: Flutter Doctor
          command: flutter doctor

      - run:
          name: Get Dependencies
          command: flutter pub get

      - run:
          name: Build APK
          command: flutter build apk --release

      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build:
    jobs:
      - build_flutter_apk
```

---

### What was wrong in your config:

| Issue | Fix |
|---|---|
| `flutter/bin/flutter` wrong path | Use `flutter` directly via orb executor |
| Used `cimg/android` image manually | Use `flutter/default` executor — has Flutter + Android preinstalled |
| Missing `flutter pub get` | Added it before build |
| `version: 2` in workflows | Removed — deprecated in 2.1 |

