version: 2.1
orbs:
  android: circleci/android@3.0.1
  flutter: circleci/flutter@2.0.0
jobs:
  build_flutter_apk:
    docker:
      - image: cimg/android:2025.11.1
    steps:
      - checkout
      - run:
          name: Install Flutter
          command: flutter/bin/flutter doctor
      - run:
          name: Build APK
          command: flutter/bin/flutter build apk --release
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
workflows:
  version: 2
  build:
    jobs:
      - build_flutter_apk